---
# Defaults for the dhcp_server role. dhcp_interface is overridden to ens19
# wherever this role is actually used (bootstrap_master.yml), since that's
# the cluster network's interface, not the mgmt one.
#
# The reservation list itself (dhcp_reservations: name/mac/ip per host) is
# NOT defined here -- it's generated by Terraform (deploy.tf) and loaded
# via dhcp_reservations.yml (see install_dhcp.yml's vars_files).

dhcp_interface: ens19
subnet: 10.50.0.0
netmask: 255.255.254.0
router: 10.50.0.1
dns_servers:
  - 1.1.1.1
  - 8.8.8.8
domain_name: lan.local
