---
# Runs against rbe-worker-1 only, reached via its mgmt IP (net0, DHCP,
# discovered from the guest agent -- same mechanism as before). It:
#
#   1. Statically pins the master's own ens19 (net1, the cluster network)
#      to 10.50.0.1, since a DHCP server can't hand out addresses on an
#      interface that doesn't have one of its own yet.
#   2. Activates the DHCP server that install_dhcp.yml already baked into
#      every clone's disk, which starts serving 10.50.x.x leases to every
#      other worker's pre-set 02:ee:ee:ee:XX:YY MAC on ens19.
#
# It also adds a stable static secondary IP on the master's ens18 (mgmt
# interface) via ens18_static_ip, so the Grafana/Prometheus URLs have a
# fixed host that doesn't depend on the mgmt DHCP lease. That address
# (master_mgmt_static_ip / master_mgmt_netmask) is passed in from Terraform.
#
# Everyone else's static IP comes purely from their Terraform-assigned MAC
# plus this DHCP server; no per-host Ansible touch is needed for
# addressing beyond this single master bootstrap.

- hosts: rbe_master_mgmt
  become: true

  vars:
    target_static_ip: "10.50.0.1"
    dhcp_interface: ens19

  roles:
    - ens19_static_ip
    # Adds the mgmt-side secondary static IP (10.0.2.123 by default). Runs
    # after ens19 so the cluster network is already pinned; adding a secondary
    # address on ens18 does not disturb the DHCP primary this play arrived on.
    - ens18_static_ip

  tasks:
    - name: Activate the DHCP server on the master
      import_role:
        name: dhcp_server
        tasks_from: activate
